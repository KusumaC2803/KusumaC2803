name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: KusumaC2803
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Upload snake files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in output/github-contribution-grid-snake.svg output/github-contribution-grid-snake-dark.svg; do
            filename=$(basename "$file")
            content=$(base64 -w 0 "$file")

            sha=$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/output/${filename}" \
              --jq '.sha' 2>/dev/null || true)

            if [ -n "$sha" ]; then
              gh api \
                --method PUT \
                "repos/${GITHUB_REPOSITORY}/contents/output/${filename}" \
                -f message="chore: update contribution snake" \
                -f content="$content" \
                -f sha="$sha" \
                -f branch="main"
            else
              gh api \
                --method PUT \
                "repos/${GITHUB_REPOSITORY}/contents/output/${filename}" \
                -f message="chore: add contribution snake" \
                -f content="$content" \
                -f branch="main"
            fi
          done
